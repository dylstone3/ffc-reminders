name: FFC Class Reminder
on:
  workflow_dispatch:
    inputs:
      class_key:
        description: 'Which class this reminder is for'
        required: true
jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python reminder.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          CLASS_KEY: ${{ github.event.inputs.class_key }}
